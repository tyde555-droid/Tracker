<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <link rel="apple-touch-icon" href="icon.png">
<title>Stack It — Income Splitter</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f0e8;
    --surface: #faf7f2;
    --surface2: #ede8df;
    --border: #ddd8ce;
    --text: #1a1a18;
    --muted: #9a9488;
    --accent: #2a6e3f;
    --accent2: #1a5a8a;
    --accent3: #c0392b;
    --font-head: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* Header */
  .header {
    margin-bottom: 48px;
  }

  .logo {
    font-family: var(--font-head);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  h1 span { color: var(--accent); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  h1 {
    font-family: var(--font-head);
    font-size: clamp(36px, 8vw, 60px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  /* Input section */
  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }

  .input-section::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .input-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .amount-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .currency-symbol {
    font-family: var(--font-head);
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  #income {
    font-family: var(--font-head);
    font-size: clamp(32px, 7vw, 52px);
    font-weight: 800;
    background: transparent;
    border: none;
    color: var(--text);
    outline: none;
    width: 100%;
    letter-spacing: -0.02em;
    caret-color: var(--accent);
  }

  #income::placeholder { color: var(--border); }

  .input-hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
    letter-spacing: 0.05em;
  }

  /* Buckets grid */
  .buckets {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }

  .bucket {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 24px;
    transition: border-color 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }

  .bucket:hover {
    border-color: #3a3a3a;
    transform: translateX(2px);
  }

  .bucket-accent {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    border-radius: 14px 0 0 14px;
  }

  .bucket-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .bucket-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .bucket-icon {
    font-size: 18px;
    line-height: 1;
  }

  .bucket-name {
    font-family: var(--font-head);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .bucket-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pct-wrapper {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .pct-input {
    font-family: var(--font-mono);
    font-size: 13px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    padding: 4px 8px;
    width: 52px;
    text-align: right;
    outline: none;
    transition: border-color 0.2s, color 0.2s;
  }

  .pct-input:focus {
    border-color: #444;
    color: var(--text);
  }

  .pct-symbol {
    font-size: 12px;
    color: var(--muted);
  }

  .bucket-amount {
    font-family: var(--font-head);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    transition: all 0.3s ease;
    min-width: 120px;
    text-align: right;
  }

  .bucket-sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.03em;
    padding-left: 28px;
  }

  .invest-growth {
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--surface2);
    border-radius: 8px;
    border-left: 2px solid #1D9E75;
    margin-left: 28px;
  }

  .invest-growth-title {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #1D9E75;
    margin-bottom: 6px;
  }

  .invest-growth-number {
    font-family: var(--font-head);
    font-size: 20px;
    font-weight: 700;
    color: #4ade80;
    letter-spacing: -0.02em;
  }

  .invest-growth-note {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Total section */
  .total-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }

  .total-section::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent2), var(--accent3));
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
  }

  .total-label {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .total-value {
    font-family: var(--font-head);
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--accent);
  }

  .pct-used {
    font-size: 13px;
    font-weight: 500;
  }

  .pct-ok { color: #4ade80; }
  .pct-warn { color: #f59e0b; }
  .pct-over { color: #f87171; }

  .warn-msg {
    font-size: 11px;
    letter-spacing: 0.05em;
    margin-top: 8px;
    padding: 8px 12px;
    border-radius: 6px;
    display: none;
  }

  .warn-msg.show { display: block; }
  .warn-msg.over { background: rgba(248,113,113,0.1); color: #f87171; }
  .warn-msg.under { background: rgba(245,158,11,0.1); color: #f59e0b; }

  /* Save button */
  .save-btn {
    width: 100%;
    padding: 16px;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    font-family: var(--font-head);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }

  .save-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .save-btn:active { transform: translateY(0); }

  .save-confirm {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
    letter-spacing: 0.05em;
    height: 16px;
    transition: all 0.3s;
  }

  /* Progress bar */
  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 12px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Animate amounts */
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  .popped { animation: pop 0.25s ease; }

  /* Footer */
  .footer {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 40px;
    letter-spacing: 0.1em;
  }

  @media (max-width: 480px) {
    .bucket { padding: 16px 18px; }
    .bucket-amount { font-size: 18px; min-width: 100px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo">Stack It</div>
    <h1>Split your<br><span>income.</span></h1>
    <p class="subtitle">Enter any amount. Watch it allocate instantly.</p>
  </div>

  <div class="input-section">
    <div class="input-label">Amount received (USD)</div>
    <div class="amount-wrapper">
      <span class="currency-symbol">$</span>
      <input type="number" id="income" placeholder="0" min="0" />
    </div>
    <div class="input-hint">Type any income amount — publishing advance, sync fee, royalty payout</div>
  </div>

  <div class="buckets" id="buckets-container">
    <!-- Buckets rendered by JS -->
  </div>

  <div class="total-section">
    <div class="total-row">
      <span class="total-label">Total allocated</span>
      <span class="total-value" id="total-value">$0</span>
    </div>
    <div class="total-row">
      <span class="total-label">Percentages used</span>
      <span class="pct-used pct-ok" id="pct-display">100%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:100%"></div>
    </div>
    <div class="warn-msg" id="warn-msg"></div>
  </div>

  <button class="save-btn" onclick="saveSettings()">Save My Settings</button>
  <div class="save-confirm" id="save-confirm"></div>

  <div class="footer">Settings saved locally in your browser · Stack It by Tyde</div>
</div>

<script>
const BUCKETS = [
  { id: 'everyday',   name: 'Everyday',     icon: '💳', color: '#378ADD', defaultPct: 20 },
  { id: 'tax',        name: 'Tax Reserve',  icon: '🏛️', color: '#E24B4A', defaultPct: 20 },
  { id: 'invest',     name: 'Investment',   icon: '📈', color: '#1D9E75', defaultPct: 15, growth: true },
  { id: 'fun',        name: 'Fun Money',    icon: '✈️', color: '#7F77DD', defaultPct: 10 },
  { id: 'rent',       name: 'Rent & Bills', icon: '🏠', color: '#EF9F27', defaultPct: 20 },
  { id: 'emergency',  name: 'Emergency',    icon: '🛡️', color: '#888780', defaultPct: 7  },
  { id: 'business',   name: 'Business',     icon: '💼', color: '#D85A30', defaultPct: 8  },
];

function loadSettings() {
  try {
    const saved = localStorage.getItem('stackit_pcts');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return null;
}

function fmt(n) {
  if (!n && n !== 0) return '—';
  return '$' + Math.round(n).toLocaleString('en-US');
}

function calcGrowth(amount, years, rate) {
  return amount * Math.pow(1 + rate, years);
}

function renderBuckets() {
  const saved = loadSettings();
  const container = document.getElementById('buckets-container');
  container.innerHTML = '';

  BUCKETS.forEach(b => {
    const pct = saved && saved[b.id] !== undefined ? saved[b.id] : b.defaultPct;
    const div = document.createElement('div');
    div.className = 'bucket';
    div.innerHTML = `
      <div class="bucket-accent" style="background:${b.color}"></div>
      <div class="bucket-top">
        <div class="bucket-left">
          <span class="bucket-icon">${b.icon}</span>
          <span class="bucket-name">${b.name}</span>
        </div>
        <div class="bucket-right">
          <div class="pct-wrapper">
            <input class="pct-input" id="p-${b.id}" type="number" value="${pct}" min="0" max="100" oninput="calc()" />
            <span class="pct-symbol">%</span>
          </div>
          <div class="bucket-amount" id="b-${b.id}" style="color:${b.color}">—</div>
        </div>
      </div>
      ${b.growth ? `
      <div class="invest-growth" id="growth-block" style="display:none">
        <div class="invest-growth-title">30-year growth @ 8% avg annual return</div>
        <div class="invest-growth-number" id="growth-value">—</div>
        <div class="invest-growth-note">If invested today in a broad market index fund</div>
      </div>
      ` : ''}
    `;
    container.appendChild(div);
  });
}

function calc() {
  const income = parseFloat(document.getElementById('income').value) || 0;
  let totalPct = 0;

  BUCKETS.forEach(b => {
    const pct = parseFloat(document.getElementById('p-' + b.id).value) || 0;
    totalPct += pct;
    const amount = income * pct / 100;
    const el = document.getElementById('b-' + b.id);
    const prev = el.textContent;
    const next = income ? fmt(amount) : '—';
    if (prev !== next) {
      el.textContent = next;
      el.classList.remove('popped');
      void el.offsetWidth;
      el.classList.add('popped');
    }

    // Investment growth block
    if (b.growth) {
      const block = document.getElementById('growth-block');
      const gv = document.getElementById('growth-value');
      if (income && amount > 0) {
        block.style.display = 'block';
        const grown = calcGrowth(amount, 30, 0.08);
        gv.textContent = fmt(grown);
      } else {
        block.style.display = 'none';
      }
    }
  });

  const pctEl = document.getElementById('pct-display');
  const fill = document.getElementById('progress-fill');
  const warn = document.getElementById('warn-msg');
  const totalVal = document.getElementById('total-value');

  const totalAmount = income * totalPct / 100;
  totalVal.textContent = income ? fmt(totalAmount) : '$0';

  const rounded = Math.round(totalPct);
  pctEl.textContent = rounded + '%';
  fill.style.width = Math.min(totalPct, 100) + '%';

  pctEl.className = 'pct-used';
  warn.className = 'warn-msg';
  warn.textContent = '';

  if (Math.abs(rounded - 100) <= 1) {
    pctEl.classList.add('pct-ok');
    fill.style.background = 'linear-gradient(90deg, #c8f564, #64c8f5)';
  } else if (rounded > 100) {
    pctEl.classList.add('pct-over');
    fill.style.background = '#f87171';
    warn.textContent = `You're ${rounded - 100}% over — reduce some buckets.`;
    warn.classList.add('show', 'over');
  } else {
    pctEl.classList.add('pct-warn');
    fill.style.background = '#f59e0b';
    warn.textContent = `${100 - rounded}% unallocated — add it somewhere.`;
    warn.classList.add('show', 'under');
  }
}

function saveSettings() {
  const data = {};
  BUCKETS.forEach(b => {
    data[b.id] = parseFloat(document.getElementById('p-' + b.id).value) || 0;
  });
  try {
    localStorage.setItem('stackit_pcts', JSON.stringify(data));
    const el = document.getElementById('save-confirm');
    el.textContent = '✓ Settings saved';
    el.style.color = '#2a6e3f';
    setTimeout(() => { el.textContent = ''; }, 2500);
  } catch(e) {
    alert('Could not save — make sure you\'re not in private browsing mode.');
  }
}

document.getElementById('income').addEventListener('input', calc);

renderBuckets();
calc();
</script>
</body>
</html>
